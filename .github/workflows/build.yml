name: Build LeadDBS Programmer ZIPs

on:
  push:
    branches: [main, publish, publish_2]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Package ${{ matrix.lead_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            electron_arch: arm64
            lead_arch: maca64
          - os: macos-15-intel
            platform: mac
            electron_arch: x64
            lead_arch: maci64
          - os: windows-latest
            platform: win
            electron_arch: x64
            # Historical Lead-DBS asset label; the executable is still x64.
            lead_arch: win32
          - os: ubuntu-latest
            platform: linux
            electron_arch: x64
            lead_arch: glnxa64

    env:
      CI: 'true'
      USE_HARD_LINKS: 'false'
      SKIP_NOTARIZE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libgtk-3-0 libnss3 libxss1 libgbm1 fakeroot rpm || true
          if ! dpkg -s libasound2 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libasound2t64
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        shell: bash
        run: |
          npx ts-node ./.erb/scripts/clean.js dist
          npm run build

      - name: Package macOS ZIP
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder \
            --${{ matrix.platform }} zip \
            --${{ matrix.electron_arch }} \
            --publish never \
            --config.artifactName=LeadDBSProgrammer_${{ matrix.lead_arch }}.zip

      - name: Package portable application
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          npx electron-builder \
            --${{ matrix.platform }} \
            --${{ matrix.electron_arch }} \
            --dir \
            --publish never

      - name: Wrap Windows application for Lead-DBS
        if: matrix.platform == 'win'
        shell: bash
        run: |
          node .github/scripts/lead-dbs-zip.cjs wrap \
            release/build/win-unpacked \
            release/build/LeadDBSProgrammer_win32.zip \
            win32

      - name: Wrap Linux application for Lead-DBS
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node .github/scripts/lead-dbs-zip.cjs wrap \
            release/build/linux-unpacked \
            release/build/LeadDBSProgrammer_glnxa64.zip \
            glnxa64

      - name: Verify release ZIP
        shell: bash
        run: |
          node .github/scripts/lead-dbs-zip.cjs verify \
            release/build/LeadDBSProgrammer_${{ matrix.lead_arch }}.zip \
            ${{ matrix.lead_arch }}

      - name: Remove packaging intermediates
        shell: bash
        run: |
          node .github/scripts/lead-dbs-zip.cjs prune \
            release/build \
            release/build/LeadDBSProgrammer_${{ matrix.lead_arch }}.zip

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LeadDBSProgrammer-${{ matrix.lead_arch }}
          path: release/build/LeadDBSProgrammer_${{ matrix.lead_arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish four release ZIPs
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: LeadDBSProgrammer-*
          path: artifacts
          merge-multiple: true

      - name: Verify exact release set
        shell: bash
        run: |
          set -euo pipefail
          expected=(maca64 maci64 win32 glnxa64)
          for arch in "${expected[@]}"; do
            test -f "artifacts/LeadDBSProgrammer_${arch}.zip"
          done
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4

      - name: Attach ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LeadDBSProgrammer_maca64.zip
            artifacts/LeadDBSProgrammer_maci64.zip
            artifacts/LeadDBSProgrammer_win32.zip
            artifacts/LeadDBSProgrammer_glnxa64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
