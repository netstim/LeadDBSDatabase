name: Build • ERB

on:
  push:
    branches: [ publish, publish_2 ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    env:
      CI: "true"
      ELECTRON_BUILDER_DEBUG: "true"
      # avoid hard links on some runners/filesystems
      USE_HARD_LINKS: "false"
      # skip notarization unless creds provided
      SKIP_NOTARIZE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux system deps commonly required by Electron packaging
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Try the legacy name first (22.04), fall back to t64 (24.04)
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libsecret-1-dev \
            libgtk-3-0 libnss3 libxss1 libgbm1 fakeroot rpm || true
          # Handle the asound rename on 24.04
          if ! dpkg -s libasound2 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libasound2t64
          fi

      # (Optional but helpful) Show environment and versions
      - run: node -v && npm -v && npx electron-builder --version

      # If your postinstall is flaky in CI, uncomment the next line and the two lines after install:
      # - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund

      # If you used --ignore-scripts above, then:
      # - run: npx electron-builder install-app-deps
      # - run: npm run build:dll

      - name: Build & Package (per OS)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Force only arm64 on CI to avoid cross-arch issues
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run package
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npm run package:win
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run package:linux
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            release/build/**/*
            !release/build/*.blockmap
            !release/build/latest*.yml

      - name: Upload builder logs (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-logs
          path: |
            ~/.cache/electron-builder/logs/**/*
          if-no-files-found: ignore

  # Optional: attach to a GitHub Release when tagging (vX.Y.Z)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
